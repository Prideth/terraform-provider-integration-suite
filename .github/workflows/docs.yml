name: Docs

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  check-docs:
    name: Generated documentation is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Regenerate documentation
        run: make docs

      - name: Fail if documentation is out of date
        run: |
          git diff --exit-code -- docs/ README.md \
            || (echo "::error::Generated documentation is out of date. Run 'make docs' and commit the result." && exit 1)
